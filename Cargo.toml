[package]
name = "cli-scheduler"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
oauth2 = "4"
tiny_http = "0.12"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
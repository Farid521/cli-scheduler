[package]
name = "cli-scheduler"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
webbrowser = "1.2.0"
dotenvy = "0.15"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"